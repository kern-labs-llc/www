      <rect x="80" y="480" width="80" height="80"/><rect x="240" y="480" width="80" height="80"/><rect x="400" y="480" width="80" height="80"/><rect x="560" y="480" width="80" height="80"/>
      <rect x="0" y="560" width="80" height="80"/><rect x="160" y="560" width="80" height="80"/><rect x="320" y="560" width="80" height="80"/><rect x="480" y="560" width="80" height="80"/>
    </g>
