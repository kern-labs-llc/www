      <rect x="0" y="80" width="80" height="80"/><rect x="160" y="80" width="80" height="80"/><rect x="320" y="80" width="80" height="80"/><rect x="480" y="80" width="80" height="80"/>
      <rect x="80" y="160" width="80" height="80"/><rect x="240" y="160" width="80" height="80"/><rect x="400" y="160" width="80" height="80"/><rect x="560" y="160" width="80" height="80"/>
      <rect x="0" y="240" width="80" height="80"/><rect x="160" y="240" width="80" height="80"/><rect x="320" y="240" width="80" height="80"/><rect x="480" y="240" width="80" height="80"/>
