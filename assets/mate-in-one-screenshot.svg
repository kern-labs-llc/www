    <text x="40" y="520" class="piece" fill="#000">♟</text><text x="120" y="520" class="piece" fill="#000">♟</text><text x="200" y="520" class="piece" fill="#000">♟</text><text x="280" y="520" class="piece" fill="#000">♛</text><text x="440" y="520" class="piece" fill="#000">♟</text><text x="520" y="520" class="piece" fill="#000">♟</text><text x="600" y="520" class="piece" fill="#000">♟</text>
