<svg xmlns="http://www.w3.org/2000/svg" width="734" height="1332" viewBox="0 0 734 1332" role="img" aria-labelledby="title desc">
  <title id="title">Mate in One app screenshot</title>
  <desc id="desc">A Mate in One chess puzzle screen with a board, chapter title, progress controls, and black to move text.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .serif{font-family:Georgia,serif;font-weight:700;fill:#2f2b2b}.sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.muted{fill:#9f9996}.orange{fill:#c45b00}.piece{font-family:Arial Unicode MS,Segoe UI Symbol,Noto Sans Symbols2,serif;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:central}.coord{font:700 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#927765}.star{font-size:34px;fill:#ff9800}.star-muted{font-size:34px;fill:#d6d4d2}
    </style>
  </defs>
  <rect width="734" height="1332" rx="16" fill="#f7f2ee"/>
  <rect width="734" height="114" fill="#fffdfa" filter="url(#softShadow)"/>
  <text x="64" y="62" class="sans" font-size="42" fill="#6f6964">☰</text>
  <text x="148" y="63" font-size="44">♞</text>
  <text x="192" y="70" class="serif" font-size="34">Mate in One</text>
  <text x="420" y="70" class="sans" font-size="34" fill="#ff9800">🏆</text>
  <text x="468" y="69" class="serif" font-size="32">0</text>
  <text x="496" y="69" class="sans" font-size="30" fill="#999">/150</text>
  <text x="578" y="68" font-size="34" fill="#999">♧</text>
  <text x="660" y="69" class="sans" font-size="42" fill="#999">↻</text>

  <text x="32" y="190" class="sans orange" font-size="26" font-weight="800" letter-spacing="4">CHAPTER IX</text>
  <circle cx="218" cy="181" r="3" fill="#d8d0c8"/>
  <text x="240" y="191" class="star">★</text><text x="270" y="191" class="star">★</text><text x="300" y="191" class="star">★</text><text x="330" y="191" class="star">★</text><text x="360" y="191" class="star-muted">★</text>
  <text x="32" y="243" class="serif" font-size="38">Double Check &amp; Mate</text>

