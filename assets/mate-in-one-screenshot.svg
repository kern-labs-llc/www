    <text x="67" y="635" class="coord">h</text><text x="147" y="635" class="coord">g</text><text x="227" y="635" class="coord">f</text><text x="307" y="635" class="coord">e</text><text x="387" y="635" class="coord">d</text><text x="467" y="635" class="coord">c</text><text x="547" y="635" class="coord">b</text><text x="627" y="635" class="coord">a</text>
  </g>

  <rect x="32" y="960" width="140" height="66" rx="8" fill="#fff" filter="url(#softShadow)"/><text x="62" y="1004" class="sans" font-size="28" fill="#5d5752">‹ Prev</text>
  <rect x="196" y="985" width="34" height="16" rx="8" fill="#ff9800"/><g fill="#d8d8d8"><circle cx="248" cy="993" r="8"/><circle cx="270" cy="993" r="8"/><circle cx="292" cy="993" r="8"/><circle cx="314" cy="993" r="8"/><circle cx="336" cy="993" r="8"/><circle cx="358" cy="993" r="8"/><circle cx="380" cy="993" r="8"/><circle cx="402" cy="993" r="8"/><circle cx="424" cy="993" r="8"/><circle cx="446" cy="993" r="8"/><circle cx="468" cy="993" r="8"/><circle cx="490" cy="993" r="8"/><circle cx="512" cy="993" r="8"/></g>
  <rect x="560" y="960" width="140" height="66" rx="8" fill="#fff" filter="url(#softShadow)"/><text x="584" y="1004" class="sans" font-size="28" fill="#5d5752">Next ›</text>
  <text x="32" y="1099" class="sans muted" font-size="26" font-weight="800" letter-spacing="3">PUZZLE 1 OF 15</text>
  <text x="32" y="1153" class="serif" font-size="42">Black to Move</text>
  <text x="32" y="1197" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#7a716b">Find checkmate in one move.</text>
  <rect x="32" y="1240" width="670" height="120" rx="12" fill="#fffaf0" stroke="#ffe082"/>
  <text x="65" y="1296" class="sans orange" font-size="22" font-weight="800" letter-spacing="3">CHAPTER THEME</text>
