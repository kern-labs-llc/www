<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kern Labs publishes thoughtful web and iOS apps with a bright, modern product focus."
    />
    <title>Kern Labs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-labelledby="page-title">
      <section class="hero-card">
        <p class="eyebrow">Web apps · iOS apps · Product experiments</p>
        <h1 id="page-title">Kern Labs</h1>
        <p class="hero-copy">
          Bright, focused software for the web and iPhone. Kern Labs creates
          modern apps that feel simple, polished, and useful from the first tap.
        </p>
        <div class="product-preview" aria-label="Abstract app preview">
          <div class="phone-frame">
            <div class="phone-status">
              <span></span>
              <span></span>
            </div>
            <div class="app-pill"></div>
            <div class="app-grid">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="floating-card floating-card-primary">
            <span class="dot"></span>
            <span>Launching soon</span>
          </div>
          <div class="floating-card floating-card-secondary">
            <span>Designed with care</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
